name: CI

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:
    branches: ['main']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      # Dead code was a real problem in the previous app — 625 unused lines in
      # one file alone (design doc §2.7). This keeps it from coming back.
      - name: Dead code
        run: npm run knip

      - name: Build
        run: npm run build

      # Both of these check the *built output* rather than the source, because
      # the failures they catch are ones a lint rule structurally cannot see: a
      # dependency reaching the critical path through a shared chunk.
      - name: Per-route JS budget
        run: npm run budget

      # The whole performance argument rests on this. The previous app shipped
      # @polkadot/api and the Polymesh SDK to every visitor; here a visitor who
      # never connects a wallet must never download any of it.
      - name: Chain stack stays lazy
        run: npm run assert:lazy
