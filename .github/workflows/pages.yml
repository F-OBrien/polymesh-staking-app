# Builds the static export and deploys it to GitHub Pages.
#
# The important step is fetching `public/data`. Generated staking data lives on
# the orphan `data` branch, written by the ingestion workflows, and is
# gitignored on every source branch — so a plain checkout produces a source tree
# that cannot build: `generateStaticParams()` for /operators/[address] returns
# nothing, and Next 16 rejects that under `output: export`.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  # Data changes must redeploy. `dataUrl()` resolves to the site's own origin by
  # default, so GitHub Pages serves the copy of `public/data` baked into the
  # last deployment — writing to the `data` branch changes nothing a visitor
  # sees until the site is rebuilt.
  #
  # That includes the 15-minute snapshot, not just the daily era: `latest.json`
  # is tier 2 in §6.6a and carries an "as of HH:MM" stamp, which would otherwise
  # be pinned to deploy time and quietly make the freshness contract a lie.
  #
  # Four deploys an hour, well inside the Pages soft limit of ten builds, and
  # each one rebuilds the whole site for one small JSON file. If that becomes a
  # nuisance, the fix is `NEXT_PUBLIC_DATA_BASE_URL` — point the data root at
  # R2 or any CDN and the snapshot stops needing a deploy at all.
  workflow_run:
    workflows: ['Ingest era', 'Snapshot latest']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # `continue-on-error` covers the bootstrap case only: before the first
      # ingestion run the branch does not exist yet. The step below turns that
      # into fixtures plus a loud warning rather than a failed deploy.
      - name: Checkout generated data
        id: data
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: data
          path: public/data

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Fall back to synthetic data
        if: steps.data.outcome != 'success'
        run: |
          echo "::warning title=No data branch::Deploying with synthetic fixtures. \
          Run the 'Ingest era' workflow to publish real data."
          npm run fixtures

      # A checkout leaves a .git directory behind; `output: export` copies
      # public/ verbatim, so without this the deploy would publish the data
      # branch's git metadata.
      - name: Remove data checkout metadata
        run: rm -rf public/data/.git

      - name: Build
        run: npm run build

      # Same two checks CI runs, against the artefact actually being deployed.
      # A bundle regression that only shows up with real data — a hundred real
      # operator pages rather than a hundred synthetic ones — would otherwise
      # reach production unnoticed.
      - name: Per-route JS budget
        run: npm run budget

      - name: Chain stack stays lazy
        run: npm run assert:lazy

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
